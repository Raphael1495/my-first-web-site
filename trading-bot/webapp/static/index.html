<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>주식 자동매매 대시보드</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Malgun Gothic", "Segoe UI", sans-serif; margin: 0; background: #f4f5f7; color: #1a1a1a; }
  .app { display: flex; height: 100vh; }

  /* 왼쪽 사이드바: 검색 + 관심종목 (HTS 스타일 고정 패널) */
  .sidebar { width: 280px; flex-shrink: 0; background: #ffffff; border-right: 1px solid #e2e4e9; display: flex; flex-direction: column; }
  .sidebar h1 { font-size: 15px; margin: 0; padding: 16px; border-bottom: 1px solid #e2e4e9; }
  .search-box { position: relative; padding: 12px; border-bottom: 1px solid #e2e4e9; }
  .search-box input { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #d5d8de; background: #f9fafb; color: #1a1a1a; font-size: 13px; }
  .search-results { position: absolute; left: 12px; right: 12px; top: 100%; background: #fff; border: 1px solid #d5d8de; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,.08); max-height: 260px; overflow-y: auto; z-index: 10; }
  .search-results div { padding: 8px 10px; cursor: pointer; font-size: 13px; }
  .search-results div:hover { background: #f0f2f5; }
  .watchlist-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 4px; }
  .watchlist-header span { font-size: 12px; color: #888; font-weight: 600; }
  .watchlist-header .add-group-btn { border: none; background: none; color: #3169d6; font-size: 16px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .watchlist { flex: 1; overflow-y: auto; }
  .group-block { border-bottom: 1px solid #f0f1f3; }
  .group-title { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 4px; font-size: 12px; color: #555; font-weight: 600; }
  .group-title .del-group { color: #ccc; font-size: 11px; cursor: pointer; }
  .group-title .del-group:hover { color: #ff5b5b; }
  .watch-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; cursor: pointer; font-size: 13px; }
  .watch-item:hover { background: #f5f7fa; }
  .watch-item.active { background: #eaf1ff; }
  .watch-item .del { color: #bbb; font-size: 11px; padding: 2px 6px; }
  .watch-item .del:hover { color: #ff5b5b; }
  .watchlist .muted { padding: 12px; }
  .indicator-toolbar { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; font-size: 12px; color: #555; flex-wrap: wrap; }
  .indicator-toolbar label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .ma5 { color: #e6a23c; } .ma20 { color: #d6362f; } .ma60 { color: #67c23a; } .ma120 { color: #9b59b6; } .bb-label { color: #3169d6; }

  /* 메인 영역 */
  main { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .price-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .price-header h2 { font-size: 20px; margin: 0; }
  .price-header .price { font-size: 22px; font-weight: 700; }
  .price-header .change.up { color: #d6362f; }
  .price-header .change.down { color: #3169d6; }
  .price-sub { color: #888; font-size: 13px; margin-bottom: 12px; }
  #chart { border: 1px solid #e2e4e9; border-radius: 8px; overflow: hidden; background: #fff; }

  .tabs { display: flex; gap: 4px; margin: 24px 0 12px; border-bottom: 1px solid #e2e4e9; }
  .tab { padding: 8px 16px; cursor: pointer; font-size: 14px; color: #888; border-bottom: 2px solid transparent; }
  .tab.active { color: #1a1a1a; border-color: #3169d6; font-weight: 600; }
  .panel { display: none; }
  .panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef0f3; }
  th { color: #888; font-weight: 500; }
  .buy { color: #d6362f; } .sell { color: #3169d6; }
  button { background: #fff; color: #333; border: 1px solid #d5d8de; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  button:hover { background: #f0f2f5; }
  button.primary { background: #3169d6; color: #fff; border-color: #3169d6; }
  button.primary:hover { background: #2857b8; }
  .add-form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .add-form input, .add-form select { padding: 6px 10px; border-radius: 6px; border: 1px solid #d5d8de; background: #f9fafb; color: #1a1a1a; font-size: 13px; }
  .muted { color: #999; font-size: 13px; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <h1>주식 자동매매 대시보드</h1>
    <div class="search-box">
      <input id="search-input" placeholder="종목명 또는 코드 검색" autocomplete="off" />
      <div id="search-results" class="search-results" style="display:none;"></div>
    </div>
    <div class="watchlist-header">
      <span>관심종목</span>
      <button class="add-group-btn" onclick="createGroup()" title="그룹 추가">＋</button>
    </div>
    <div id="watchlist" class="watchlist"></div>
  </aside>

  <main>
    <div class="price-header">
      <h2 id="chart-title">종목을 검색해서 선택하세요</h2>
      <span id="price-now" class="price"></span>
      <span id="price-change" class="change"></span>
    </div>
    <div class="price-sub">
      <select id="watch-group-select" style="padding:4px 8px; border-radius:6px; border:1px solid #d5d8de;"></select>
      <button id="add-watch-btn" onclick="addCurrentToWatchlist()">☆ 관심종목에 추가</button>
    </div>
    <div class="indicator-toolbar">
      <label><input type="checkbox" id="ma5-toggle" checked onchange="updateIndicators()"><span class="ma5">■</span> 5일선</label>
      <label><input type="checkbox" id="ma20-toggle" checked onchange="updateIndicators()"><span class="ma20">■</span> 20일선</label>
      <label><input type="checkbox" id="ma60-toggle" checked onchange="updateIndicators()"><span class="ma60">■</span> 60일선</label>
      <label><input type="checkbox" id="ma120-toggle" checked onchange="updateIndicators()"><span class="ma120">■</span> 120일선</label>
      <label><input type="checkbox" id="bb-toggle" checked onchange="updateIndicators()"><span class="bb-label">■</span> 볼린저밴드(20)</label>
    </div>
    <div id="chart"></div>

    <div class="tabs">
      <div class="tab active" data-panel="holdings">보유종목</div>
      <div class="tab" data-panel="journal">매매일지</div>
    </div>

    <div id="panel-holdings" class="panel active">
      <table>
        <thead><tr><th>코드</th><th>이름</th><th>수량</th><th>평단가</th></tr></thead>
        <tbody id="holdings-body"></tbody>
      </table>
      <p class="muted">매매일지에 기록된 매수/매도 내역으로 자동 계산됩니다.</p>
    </div>

    <div id="panel-journal" class="panel">
      <div class="add-form">
        <input id="j-code" placeholder="코드" style="width:80px" />
        <input id="j-name" placeholder="이름" style="width:100px" />
        <select id="j-side"><option value="buy">매수</option><option value="sell">매도</option></select>
        <input id="j-shares" placeholder="수량" type="number" style="width:80px" />
        <input id="j-price" placeholder="가격" type="number" style="width:100px" />
        <input id="j-note" placeholder="메모 (선택)" style="width:160px" />
        <button class="primary" onclick="addTrade()">기록 추가</button>
      </div>
      <table>
        <thead><tr><th>일시</th><th>코드</th><th>이름</th><th>구분</th><th>수량</th><th>가격</th><th>메모</th></tr></thead>
        <tbody id="journal-body"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
let currentSymbol = null;
let chart, series;
let maSeries = {};
let bbSeries = {};
let watchlistCache = [];
let groupsCache = [];
let currentChartData = [];

function initChart() {
  const el = document.getElementById('chart');
  chart = LightweightCharts.createChart(el, {
    width: el.clientWidth,
    height: 440,
    layout: { background: { color: '#ffffff' }, textColor: '#333' },
    grid: { vertLines: { color: '#f0f1f3' }, horzLines: { color: '#f0f1f3' } },
    timeScale: { borderColor: '#e2e4e9' },
    rightPriceScale: { borderColor: '#e2e4e9' },
  });
  series = chart.addCandlestickSeries({
    upColor: '#d6362f', downColor: '#3169d6', borderVisible: false,
    wickUpColor: '#d6362f', wickDownColor: '#3169d6',
  });

  const maColors = { ma5: '#e6a23c', ma20: '#d6362f', ma60: '#67c23a', ma120: '#9b59b6' };
  for (const [key, color] of Object.entries(maColors)) {
    maSeries[key] = chart.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  }
  bbSeries.upper = chart.addLineSeries({ color: '#3169d6', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });
  bbSeries.lower = chart.addLineSeries({ color: '#3169d6', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });

  window.addEventListener('resize', () => chart.applyOptions({ width: el.clientWidth }));
}

function sma(data, period) {
  const out = [];
  for (let i = period - 1; i < data.length; i++) {
    let sum = 0;
    for (let j = i - period + 1; j <= i; j++) sum += data[j].close;
    out.push({ time: data[i].time, value: sum / period });
  }
  return out;
}

function bollingerBands(data, period = 20, mult = 2) {
  const upper = [], lower = [];
  for (let i = period - 1; i < data.length; i++) {
    const slice = data.slice(i - period + 1, i + 1).map(d => d.close);
    const mean = slice.reduce((a, b) => a + b, 0) / period;
    const variance = slice.reduce((a, b) => a + (b - mean) ** 2, 0) / period;
    const std = Math.sqrt(variance);
    upper.push({ time: data[i].time, value: mean + mult * std });
    lower.push({ time: data[i].time, value: mean - mult * std });
  }
  return { upper, lower };
}

function updateIndicators() {
  const toggles = { ma5: 5, ma20: 20, ma60: 60, ma120: 120 };
  for (const [key, period] of Object.entries(toggles)) {
    const on = document.getElementById(key + '-toggle').checked;
    maSeries[key].setData(on && currentChartData.length ? sma(currentChartData, period) : []);
  }
  const bbOn = document.getElementById('bb-toggle').checked;
  if (bbOn && currentChartData.length) {
    const { upper, lower } = bollingerBands(currentChartData, 20, 2);
    bbSeries.upper.setData(upper);
    bbSeries.lower.setData(lower);
  } else {
    bbSeries.upper.setData([]);
    bbSeries.lower.setData([]);
  }
}

async function loadChart(code, name) {
  currentSymbol = { code, name };
  document.getElementById('chart-title').textContent = `${name} (${code})`;
  highlightActiveWatch();
  const res = await fetch(`/api/chart/${code}?period=1y`);
  if (!res.ok) {
    document.getElementById('price-now').textContent = '';
    document.getElementById('price-change').textContent = '';
    alert('차트 데이터를 불러오지 못했습니다.');
    return;
  }
  const data = await res.json();
  currentChartData = data;
  series.setData(data);
  updateIndicators();
  chart.timeScale().fitContent();

  if (data.length >= 2) {
    const last = data[data.length - 1], prev = data[data.length - 2];
    const diff = last.close - prev.close;
    const pct = (diff / prev.close * 100).toFixed(2);
    const up = diff >= 0;
    document.getElementById('price-now').textContent = Math.round(last.close).toLocaleString() + '원';
    const chEl = document.getElementById('price-change');
    chEl.textContent = `${up ? '▲' : '▼'} ${Math.abs(diff).toLocaleString()} (${up ? '+' : ''}${pct}%)`;
    chEl.className = 'change ' + (up ? 'up' : 'down');
  }
}

const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let searchTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (!q) { searchResults.style.display = 'none'; return; }
  searchTimer = setTimeout(async () => {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const items = await res.json();
    searchResults.innerHTML = items.map(i =>
      `<div onclick="selectSymbol('${i.code}', '${i.name}')">${i.name} (${i.code}) · ${i.market}</div>`
    ).join('') || '<div class="muted">검색 결과 없음</div>';
    searchResults.style.display = 'block';
  }, 250);
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-box')) searchResults.style.display = 'none';
});

function selectSymbol(code, name) {
  searchInput.value = '';
  searchResults.style.display = 'none';
  loadChart(code, name);
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
  });
});

function highlightActiveWatch() {
  document.querySelectorAll('.watch-item').forEach(el => {
    el.classList.toggle('active', currentSymbol && el.dataset.code === currentSymbol.code);
  });
}

async function refreshGroups() {
  const res = await fetch('/api/groups');
  groupsCache = await res.json();
  const select = document.getElementById('watch-group-select');
  const prevValue = select.value;
  select.innerHTML = groupsCache.map(g => `<option value="${g.name}">${g.name}</option>`).join('');
  if (groupsCache.some(g => g.name === prevValue)) select.value = prevValue;
}

async function createGroup() {
  const name = prompt('새 그룹 이름을 입력하세요');
  if (!name || !name.trim()) return;
  await fetch('/api/groups', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name.trim() }),
  });
  await refreshGroups();
  refreshWatchlist();
}

async function removeGroup(name) {
  if (!confirm(`'${name}' 그룹을 삭제할까요? (안의 종목은 기본 그룹으로 이동됩니다)`)) return;
  await fetch(`/api/groups/${encodeURIComponent(name)}`, { method: 'DELETE' });
  await refreshGroups();
  refreshWatchlist();
}

async function refreshWatchlist() {
  const res = await fetch('/api/watchlist');
  watchlistCache = await res.json();
  const el = document.getElementById('watchlist');

  if (watchlistCache.length === 0 && groupsCache.length <= 1) {
    el.innerHTML = '<div class="muted">관심종목이 없습니다.<br>종목 검색 후 추가하세요.</div>';
  } else {
    const order = groupsCache.map(g => g.name);
    const byGroup = {};
    for (const item of watchlistCache) (byGroup[item.group_name] ??= []).push(item);
    el.innerHTML = order.map(groupName => {
      const items = byGroup[groupName] || [];
      const delBtn = groupName === '기본' ? '' : `<span class="del-group" onclick="removeGroup('${groupName}')">그룹삭제</span>`;
      const rows = items.map(i => `
        <div class="watch-item" data-code="${i.code}" onclick="loadChart('${i.code}', '${i.name}')">
          <span>${i.name}</span>
          <span class="del" onclick="event.stopPropagation(); removeWatch('${i.code}')">✕</span>
        </div>`).join('') || '<div class="muted" style="padding:4px 12px;">비어있음</div>';
      return `<div class="group-block"><div class="group-title"><span>${groupName}</span>${delBtn}</div>${rows}</div>`;
    }).join('');
  }
  highlightActiveWatch();
  document.getElementById('add-watch-btn').textContent =
    currentSymbol && watchlistCache.some(w => w.code === currentSymbol.code) ? '★ 관심종목에서 제거' : '☆ 관심종목에 추가';
}

async function removeWatch(code) {
  await fetch(`/api/watchlist/${code}`, { method: 'DELETE' });
  refreshWatchlist();
}

async function addCurrentToWatchlist() {
  if (!currentSymbol) { alert('먼저 종목을 검색해서 선택하세요.'); return; }
  const already = watchlistCache.some(w => w.code === currentSymbol.code);
  if (already) { await removeWatch(currentSymbol.code); return; }
  const groupName = document.getElementById('watch-group-select').value || '기본';
  await fetch('/api/watchlist', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...currentSymbol, group_name: groupName }),
  });
  refreshWatchlist();
}

async function refreshHoldings() {
  const res = await fetch('/api/holdings');
  const items = await res.json();
  document.getElementById('holdings-body').innerHTML = items.map(i => `
    <tr><td>${i.code}</td><td>${i.name}</td><td>${i.shares}</td><td>${Math.round(i.avg_price).toLocaleString()}</td></tr>
  `).join('') || '<tr><td colspan="4" class="muted">보유 중인 종목이 없습니다.</td></tr>';
}

async function refreshJournal() {
  const res = await fetch('/api/trades');
  const items = await res.json();
  document.getElementById('journal-body').innerHTML = items.map(i => `
    <tr>
      <td>${i.traded_at.slice(0,16).replace('T',' ')}</td><td>${i.code}</td><td>${i.name}</td>
      <td class="${i.side}">${i.side === 'buy' ? '매수' : '매도'}</td>
      <td>${i.shares}</td><td>${Math.round(i.price).toLocaleString()}</td><td>${i.note || ''}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="muted">매매 기록이 없습니다.</td></tr>';
}

async function addTrade() {
  const body = {
    code: document.getElementById('j-code').value.trim(),
    name: document.getElementById('j-name').value.trim(),
    side: document.getElementById('j-side').value,
    shares: parseInt(document.getElementById('j-shares').value, 10),
    price: parseFloat(document.getElementById('j-price').value),
    note: document.getElementById('j-note').value.trim(),
  };
  if (!body.code || !body.name || !body.shares || !body.price) { alert('코드/이름/수량/가격을 입력하세요.'); return; }
  await fetch('/api/trades', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  ['j-code','j-name','j-shares','j-price','j-note'].forEach(id => document.getElementById(id).value = '');
  refreshJournal();
  refreshHoldings();
}

initChart();
refreshGroups().then(refreshWatchlist);
refreshHoldings();
refreshJournal();
</script>
</body>
</html>
