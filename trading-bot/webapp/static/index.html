<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>주식 자동매매 대시보드</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Malgun Gothic", "Segoe UI", sans-serif; margin: 0; background: #f4f5f7; color: #1a1a1a; }
  .app { display: flex; height: 100vh; }

  /* 왼쪽 사이드바: 검색 + 관심종목 (HTS 스타일 고정 패널) */
  .sidebar { width: 280px; flex-shrink: 0; background: #ffffff; border-right: 1px solid #e2e4e9; display: flex; flex-direction: column; }
  .sidebar h1 { font-size: 15px; margin: 0; padding: 16px; border-bottom: 1px solid #e2e4e9; }
  .search-box { position: relative; padding: 12px; border-bottom: 1px solid #e2e4e9; }
  .search-box input { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #d5d8de; background: #f9fafb; color: #1a1a1a; font-size: 13px; }
  .search-results { position: absolute; left: 12px; right: 12px; top: 100%; background: #fff; border: 1px solid #d5d8de; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,.08); max-height: 260px; overflow-y: auto; z-index: 10; }
  .search-results div { padding: 8px 10px; cursor: pointer; font-size: 13px; }
  .search-results div:hover { background: #f0f2f5; }
  .watchlist-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 4px; }
  .watchlist-header span { font-size: 12px; color: #888; font-weight: 600; }
  .watchlist-header .add-group-btn { border: none; background: none; color: #3169d6; font-size: 16px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .watchlist { flex: 1; overflow-y: auto; }
  .group-block { border-bottom: 1px solid #f0f1f3; }
  .group-title { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 4px; font-size: 12px; color: #555; font-weight: 600; }
  .group-title .del-group { color: #ccc; font-size: 11px; cursor: pointer; }
  .group-title .del-group:hover { color: #ff5b5b; }
  .watch-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; cursor: pointer; font-size: 13px; gap: 6px; }
  .watch-item:hover { background: #f5f7fa; }
  .watch-item.active { background: #eaf1ff; }
  .watch-item .name-col { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .watch-item .price-col { font-size: 12px; text-align: right; white-space: nowrap; color: #999; }
  .watch-item .price-col.up { color: #d6362f; } .watch-item .price-col.down { color: #3169d6; }
  .watch-item .del { color: #bbb; font-size: 11px; padding: 2px 6px; }
  .watch-item .del:hover { color: #ff5b5b; }
  .watchlist .muted { padding: 12px; }
  .indicator-toolbar { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; font-size: 12px; color: #555; flex-wrap: wrap; }
  .indicator-toolbar label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .ma5 { color: #e6a23c; } .ma20 { color: #d6362f; } .ma60 { color: #67c23a; } .ma120 { color: #9b59b6; } .bb-label { color: #3169d6; }

  /* 메인 영역 */
  main { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .price-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .price-header h2 { font-size: 20px; margin: 0; }
  .price-header .price { font-size: 22px; font-weight: 700; }
  .price-header .change.up { color: #d6362f; }
  .price-header .change.down { color: #3169d6; }
  .price-sub { color: #888; font-size: 13px; margin-bottom: 12px; }
  #chart { border: 1px solid #e2e4e9; border-radius: 8px; overflow: hidden; background: #fff; }
  .journal-scroll { max-height: 528px; overflow-y: auto; }
  .journal-scroll thead th { position: sticky; top: 0; background: #fff; }

  .tabs-panels-row { display: flex; gap: 20px; align-items: flex-start; margin-top: 24px; }
  .tabs-col { flex: 0 0 10%; max-width: 10%; }
  .panels-col { flex: 1 1 0; min-width: 0; }
  .tabs { display: flex; flex-direction: column; gap: 2px; margin: 0 0 16px; }
  .tab { padding: 10px 12px; cursor: pointer; font-size: 14px; color: #888; border-left: 2px solid transparent; border-radius: 0 6px 6px 0; }
  .tab.active { color: #1a1a1a; border-color: #3169d6; background: #eaf1ff; font-weight: 600; }
  .tabs-col .pnl-summary { flex-direction: column; gap: 14px; }
  .panel { display: none; }
  .panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef0f3; }
  th { color: #888; font-weight: 500; }
  .buy { color: #d6362f; } .sell { color: #3169d6; }
  button { background: #fff; color: #333; border: 1px solid #d5d8de; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  button:hover { background: #f0f2f5; }
  button.primary { background: #3169d6; color: #fff; border-color: #3169d6; }
  button.primary:hover { background: #2857b8; }
  .add-form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .add-form input, .add-form select { padding: 6px 10px; border-radius: 6px; border: 1px solid #d5d8de; background: #f9fafb; color: #1a1a1a; font-size: 13px; }
  .muted { color: #999; font-size: 13px; }

  .tf-toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
  .tf-btn { font-size: 12px; padding: 5px 10px; }
  .tf-btn.active { background: #3169d6; color: #fff; border-color: #3169d6; }
  .tf-toolbar select { padding: 5px 8px; border-radius: 6px; border: 1px solid #d5d8de; font-size: 12px; }
  .tf-btn[disabled] { color: #ccc; cursor: not-allowed; }

  .btn-buy { color: #d6362f; border-color: #d6362f; }
  .btn-sell { color: #3169d6; border-color: #3169d6; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal-box { background: #fff; border-radius: 10px; padding: 20px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
  .modal-box h3 { margin: 0 0 14px; font-size: 15px; }
  .modal-box .add-form { flex-direction: column; }
  .modal-box .add-form input { width: 100%; }

  .pnl-summary { display: flex; gap: 24px; flex-wrap: wrap; background: #fff; border: 1px solid #e2e4e9; border-radius: 8px; padding: 14px 18px; margin-bottom: 16px; }
  .pnl-stat .label { font-size: 12px; color: #999; margin-bottom: 2px; }
  .pnl-stat .value { font-size: 17px; font-weight: 700; }
  .pnl-stat .value.up { color: #d6362f; } .pnl-stat .value.down { color: #3169d6; }
  .pnl-by-stock { margin-top: 4px; }

  #backtest-chart { border: 1px solid #e2e4e9; border-radius: 8px; overflow: hidden; background: #fff; margin: 12px 0; }
  .bt-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .bt-form input { padding: 6px 10px; border-radius: 6px; border: 1px solid #d5d8de; background: #f9fafb; font-size: 13px; }
  .bt-form label { font-size: 12px; color: #666; display: flex; align-items: center; gap: 4px; }

  .chart-hoga-row { display: flex; gap: 12px; }
  .chart-hoga-row #chart { flex: 1; min-width: 0; }
  #hoga-panel { width: 190px; flex-shrink: 0; border: 1px solid #e2e4e9; border-radius: 8px; background: #fff; overflow: hidden; }
  #hoga-panel table { font-size: 12px; }

  #hoga-panel .hoga-price { text-align: center; font-weight: 600; background: #f7f8fa; }
  .ask-side { color: #d6362f; } .bid-side { color: #3169d6; }
  .hoga-note { font-size: 11px; color: #aaa; padding: 6px 8px; border-top: 1px solid #f0f1f3; }

  .market-toggle { display: flex; gap: 6px; padding: 10px 12px 0; }
  .market-btn { flex: 1; padding: 6px 0; font-size: 12px; text-align: center; }
  .market-btn.active { background: #3169d6; color: #fff; border-color: #3169d6; }
  .exchange-tag { font-size: 10px; color: #999; margin-left: 4px; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <h1>주식 자동매매 대시보드</h1>
    <div class="market-toggle">
      <button class="market-btn active" data-market="domestic" onclick="setMarket('domestic', this)">국내</button>
      <button class="market-btn" data-market="overseas" onclick="setMarket('overseas', this)">해외</button>

    <div id="watchlist" class="watchlist"></div>

  <main>
    <div class="price-header">

      <span id="price-change" class="change"></span>

    <div class="price-sub">
      <select id="watch-group-select" style="padding:4px 8px; border-radius:6px; border:1px solid #d5d8de;"></select>

      <button class="btn-buy" onclick="openOrderModal('buy')">매수</button>

      <span class="muted">(국내주식만 KIS 연동 지원, 해외주식은 매매일지 기록만 됩니다)</span>
    </div>
    <div class="tf-toolbar">
      <button class="tf-btn active" data-interval="1d" onclick="setInterval_('1d', this)">일봉</button>
      <button class="tf-btn" data-interval="1wk" onclick="setInterval_('1wk', this)">주봉</button>
      <button class="tf-btn" data-interval="1mo" onclick="setInterval_('1mo', this)">월봉</button>

        <option value="">분봉 선택</option>
        <option value="1m">1분</option>
        <option value="3m">3분</option>
        <option value="5m">5분</option>
        <option value="10m">10분</option>
        <option value="30m">30분</option>
        <option value="60m">60분</option>
      </select>
      <button class="tf-btn" disabled title="KIS API 실시간 연동 후 지원 예정">틱(준비중)</button>
    </div>
    <div class="indicator-toolbar">
      <label><input type="checkbox" id="ma5-toggle" checked onchange="updateIndicators()"><span class="ma5">■</span> 5일선</label>
      <label><input type="checkbox" id="ma20-toggle" checked onchange="updateIndicators()"><span class="ma20">■</span> 20일선</label>
      <label><input type="checkbox" id="ma60-toggle" checked onchange="updateIndicators()"><span class="ma60">■</span> 60일선</label>
      <label><input type="checkbox" id="ma120-toggle" checked onchange="updateIndicators()"><span class="ma120">■</span> 120일선</label>
      <label><input type="checkbox" id="bb-toggle" checked onchange="updateIndicators()"><span class="bb-label">■</span> 볼린저밴드(20)</label>
    </div>
    <div class="chart-hoga-row">
      <div id="chart"></div>
      <div id="hoga-panel" style="display:none;">
        <table>
          <thead><tr><th>매도잔량</th><th>호가</th><th>매수잔량</th></tr></thead>
          <tbody id="hoga-body"></tbody>
        </table>
        <div class="hoga-note">1~2초 간격 새로고침 (실시간 아님)</div>
      </div>
    </div>

    <div class="tabs-panels-row">
      <div class="tabs-col">
        <div class="tabs">
          <div class="tab active" data-panel="holdings">보유종목</div>
          <div class="tab" data-panel="journal">매매일지</div>
          <div class="tab" data-panel="backtest">백테스트</div>
        </div>
        <div id="pnl-summary" class="pnl-summary"></div>
      </div>

      <div class="panels-col">
        <div id="panel-holdings" class="panel active">
          <table>
            <thead><tr><th>코드</th><th>이름</th><th>수량</th><th>평단가</th><th>등락률</th><th>메모</th></tr></thead>
            <tbody id="holdings-body"></tbody>
          </table>
          <p class="muted">매매일지에 기록된 매수/매도 내역으로 자동 계산됩니다. 등락률은 매수평단가 대비 현재가 기준입니다.</p>
        </div>

        <div id="panel-journal" class="panel">
          <div class="add-form">
            <input id="j-code" placeholder="코드" style="width:80px" />
            <input id="j-name" placeholder="이름" style="width:100px" />
            <select id="j-side"><option value="buy">매수</option><option value="sell">매도</option></select>

            <input id="j-price" placeholder="가격" type="number" style="width:100px" />
            <input id="j-note" placeholder="메모 (선택)" style="width:160px" />
            <button class="primary" onclick="addTrade()">기록 추가</button>
          </div>
          <div class="journal-scroll">
            <table>
              <thead><tr><th>일시</th><th>코드</th><th>이름</th><th>구분</th><th>수량</th><th>등락률</th><th>가격</th><th>메모</th></tr></thead>
              <tbody id="journal-body"></tbody>
            </table>
          </div>
        </div>

        <div id="panel-backtest" class="panel">
          <div class="bt-form">
            <input id="bt-symbols" placeholder="종목코드 (쉼표로 구분, 예: 005930,000660)" style="width:260px" />
            <label>기간 <input id="bt-period" value="3y" style="width:50px" /></label>
            <label>초기자산 <input id="bt-capital" type="number" value="10000000" style="width:110px" /></label>
            <label>단기이평 <input id="bt-fast" type="number" value="20" style="width:50px" /></label>
            <label>장기이평 <input id="bt-slow" type="number" value="60" style="width:50px" /></label>

          <div id="bt-status" class="muted"></div>
          <div id="bt-metrics" class="pnl-summary" style="display:none;"></div>
          <div id="backtest-chart" style="display:none; height:280px;"></div>
          <table id="bt-trades-table" style="display:none;">
            <thead><tr><th>종목</th><th>진입일</th><th>청산일</th><th>진입가</th><th>청산가</th><th>수량</th><th>손익</th><th>사유</th></tr></thead>

</div>

<div id="order-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h3 id="order-modal-title"></h3>
    <div class="add-form">
      <input id="o-shares" type="number" placeholder="수량" />
      <input id="o-price" type="number" placeholder="가격" />
      <input id="o-note" placeholder="메모 (선택)" />
    </div>
    <div id="o-exchange-row" style="margin-top:8px; display:none;">
      <select id="o-exchange" style="width:100%; padding:6px 10px; border-radius:6px; border:1px solid #d5d8de;">
        <option value="NASD">나스닥 (NASD)</option>
        <option value="NYSE">뉴욕 (NYSE)</option>
        <option value="AMEX">아멕스 (AMEX)</option>
      </select>
    </div>
    <label style="display:flex; align-items:center; gap:6px; margin-top:10px; font-size:13px;">
      <input type="checkbox" id="o-real-order" checked /> <span id="o-real-order-label">KIS 계좌에도 실제 주문 전송</span>
    </label>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:14px;">
      <button onclick="closeOrderModal()">취소</button>
      <button class="primary" onclick="submitOrder()">주문/기록</button>
    </div>
  </div>
</div>

<script>
let currentSymbol = null;
let chart, series;
let maSeries = {};
let bbSeries = {};
let watchlistCache = [];
let groupsCache = [];
let holdingsCache = [];
let currentChartData = [];
let currentInterval = '1d';
let currentMarket = 'domestic';

function setMarket(market, btnEl) {
  currentMarket = market;
  document.querySelectorAll('.market-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  searchInput.placeholder = market === 'overseas' ? '해외 티커 검색 (예: AAPL, Apple)' : '종목명 또는 코드 검색';
  searchInput.value = '';
  searchResults.style.display = 'none';
  saveSettings();
}

function initChart() {
  const el = document.getElementById('chart');
  chart = LightweightCharts.createChart(el, {
    width: el.clientWidth,
    height: 352,
    layout: { background: { color: '#ffffff' }, textColor: '#333' },
    grid: { vertLines: { color: '#f0f1f3' }, horzLines: { color: '#f0f1f3' } },
    timeScale: { borderColor: '#e2e4e9' },
    rightPriceScale: { borderColor: '#e2e4e9' },
  });
  series = chart.addCandlestickSeries({
    upColor: '#d6362f', downColor: '#3169d6', borderVisible: false,
    wickUpColor: '#d6362f', wickDownColor: '#3169d6',
  });

  const maColors = { ma5: '#e6a23c', ma20: '#d6362f', ma60: '#67c23a', ma120: '#9b59b6' };
  for (const [key, color] of Object.entries(maColors)) {
    maSeries[key] = chart.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  }
  bbSeries.upper = chart.addLineSeries({ color: '#3169d6', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });
  bbSeries.lower = chart.addLineSeries({ color: '#3169d6', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });

  window.addEventListener('resize', () => chart.applyOptions({ width: el.clientWidth }));
}

function sma(data, period) {
  const out = [];
  for (let i = period - 1; i < data.length; i++) {
    let sum = 0;
    for (let j = i - period + 1; j <= i; j++) sum += data[j].close;
    out.push({ time: data[i].time, value: sum / period });
  }
  return out;
}

function bollingerBands(data, period = 20, mult = 2) {
  const upper = [], lower = [];
  for (let i = period - 1; i < data.length; i++) {
    const slice = data.slice(i - period + 1, i + 1).map(d => d.close);
    const mean = slice.reduce((a, b) => a + b, 0) / period;
    const variance = slice.reduce((a, b) => a + (b - mean) ** 2, 0) / period;
    const std = Math.sqrt(variance);
    upper.push({ time: data[i].time, value: mean + mult * std });
    lower.push({ time: data[i].time, value: mean - mult * std });
  }
  return { upper, lower };
}

function updateIndicators() {
  const toggles = { ma5: 5, ma20: 20, ma60: 60, ma120: 120 };
  for (const [key, period] of Object.entries(toggles)) {
    const on = document.getElementById(key + '-toggle').checked;
    maSeries[key].setData(on && currentChartData.length ? sma(currentChartData, period) : []);
  }
  const bbOn = document.getElementById('bb-toggle').checked;
  if (bbOn && currentChartData.length) {
    const { upper, lower } = bollingerBands(currentChartData, 20, 2);
    bbSeries.upper.setData(upper);
    bbSeries.lower.setData(lower);
  } else {
    bbSeries.upper.setData([]);
    bbSeries.lower.setData([]);
  }
  saveSettings();
}

function setInterval_(interval, btnEl) {
  currentInterval = interval;
  document.querySelectorAll('.tf-btn[data-interval]').forEach(b => b.classList.remove('active'));
  if (btnEl) {
    btnEl.classList.add('active');
    document.getElementById('minute-select').value = '';
  } else {
    document.getElementById('minute-select').value = interval;
  }
  if (currentSymbol) loadChart(currentSymbol.code, currentSymbol.name, currentSymbol.market, currentSymbol.exchange);
  saveSettings();
}

let hogaTimer = null;

function toggleHoga() {
  const on = document.getElementById('hoga-toggle').checked;
  document.getElementById('hoga-panel').style.display = on ? 'block' : 'none';
  chart.applyOptions({ width: document.getElementById('chart').clientWidth });
  if (hogaTimer) { clearInterval(hogaTimer); hogaTimer = null; }
  if (on) {
    fetchHoga();
    hogaTimer = setInterval(fetchHoga, 2000);
  }
  saveSettings();
}

async function fetchHoga() {
  if (!currentSymbol || !document.getElementById('hoga-toggle').checked) return;
  try {
    const res = await fetch(`/api/hoga/${currentSymbol.code}`);
    renderHoga(await res.json());
  } catch {
    document.getElementById('hoga-body').innerHTML =
      '<tr><td colspan="3" class="muted" style="padding:8px;">조회 실패</td></tr>';
  }
}

function renderHoga(data) {
  const body = document.getElementById('hoga-body');
  if (data.error) {
    body.innerHTML = `<tr><td colspan="3" class="muted" style="padding:8px; font-size:11px;">KIS 연동 필요/실패: ${data.error}</td></tr>`;
    return;
  }
  if (!data.rows) {
    body.innerHTML = `<tr><td colspan="3" class="muted" style="padding:8px; font-size:10px;">응답 형식이 예상과 달라요. 이 내용을 캡처해서 보여주세요:<br><pre style="white-space:pre-wrap;">${JSON.stringify(data.raw)}</pre></td></tr>`;
    return;
  }
  const asks = [...data.rows].reverse();
  let html = asks.map(r => `
    <tr><td class="ask-side">${r.ask_qty.toLocaleString()}</td><td class="hoga-price">${r.ask_price.toLocaleString()}</td><td></td></tr>`
  ).join('');
  html += data.rows.map(r => `
    <tr><td></td><td class="hoga-price">${r.bid_price.toLocaleString()}</td><td class="bid-side">${r.bid_qty.toLocaleString()}</td></tr>`
  ).join('');
  body.innerHTML = html;
}

async function loadChart(code, name, market, exchange) {
  currentSymbol = { code, name, market: market || 'domestic', exchange: exchange || 'NASD' };
  document.getElementById('chart-title').textContent = `${name} (${code})`;
  highlightActiveWatch();
  updateWatchBtnLabel();
  saveSettings();

  const hogaToggle = document.getElementById('hoga-toggle');
  hogaToggle.disabled = currentSymbol.market === 'overseas';
  if (currentSymbol.market === 'overseas') {
    if (hogaToggle.checked) { hogaToggle.checked = false; toggleHoga(); }
  } else if (!hogaToggle.checked) {
    hogaToggle.checked = true;  // 국내 종목은 항상 오른쪽에 호가창이 보이도록 자동으로 켠다
    toggleHoga();
  } else {
    fetchHoga();
  }

  const res = await fetch(`/api/chart/${code}?interval=${currentInterval}&market=${currentSymbol.market}`);
  if (!res.ok) {
    document.getElementById('price-now').textContent = '';
    document.getElementById('price-change').textContent = '';
    alert('차트 데이터를 불러오지 못했습니다.');
    return;
  }
  const data = await res.json();
  currentChartData = data;
  series.setData(data);
  updateIndicators();
  chart.timeScale().fitContent();

  const unit = currentSymbol.market === 'overseas' ? '$' : '원';
  if (data.length >= 2) {
    const last = data[data.length - 1], prev = data[data.length - 2];
    const diff = last.close - prev.close;
    const pct = (diff / prev.close * 100).toFixed(2);
    const up = diff >= 0;
    document.getElementById('price-now').textContent = Math.round(last.close).toLocaleString() + unit;
    const chEl = document.getElementById('price-change');
    chEl.textContent = `${up ? '▲' : '▼'} ${Math.abs(diff).toLocaleString()} (${up ? '+' : ''}${pct}%)`;
    chEl.className = 'change ' + (up ? 'up' : 'down');
  }
}

const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let searchTimer;
let searchItems = [];
function renderSearchResults(items) {
  searchItems = items;
  searchResults.innerHTML = items.map(i => {
    const tag = currentMarket === 'overseas' ? i.exchange : i.market;
    return `<div onclick="selectSymbol('${i.code}', '${i.name}', '${currentMarket}', '${i.exchange || ''}')">${i.name} (${i.code}) · ${tag}</div>`;
  }).join('') || '<div class="muted">검색 결과 없음</div>';
  searchResults.style.display = 'block';
}
async function fetchSearchResults(q) {
  const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&market=${currentMarket}`);
  return res.json();
}
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (!q) { searchResults.style.display = 'none'; searchItems = []; return; }
  searchTimer = setTimeout(async () => {
    renderSearchResults(await fetchSearchResults(q));
  }, 250);
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab' && e.key !== 'Enter') return;
  const q = searchInput.value.trim();
  if (!q) {
    // Tab으로 이미 선택해둔 상태(검색창 비어있음)에서 Enter만 누르면 관심종목에 저장
    if (e.key === 'Enter' && currentSymbol) {
      e.preventDefault();
      addCurrentToWatchlist();
    }
    return;
  }
  // 검색 직후 디바운스(250ms)가 아직 안 끝났을 수 있으므로, preventDefault는
  // 항상 동기적으로 먼저 호출해서 Tab 포커스 이동/기본 동작을 막아둔다.
  e.preventDefault();
  const isEnter = e.key === 'Enter';
  const finish = (items) => {
    if (!items.length) return;
    const i = items[0];
    selectSymbol(i.code, i.name, currentMarket, i.exchange || '');
    if (isEnter) addCurrentToWatchlist();
  };
  if (searchItems.length) {
    finish(searchItems);
  } else {
    clearTimeout(searchTimer);
    fetchSearchResults(q).then(finish);
  }
});
document.addEventListener('keydown', (e) => {
  if (!(e.metaKey || e.ctrlKey)) return;
  if (e.key === '1') {
    e.preventDefault();
    setMarket('domestic', document.querySelector('.market-btn[data-market="domestic"]'));
  } else if (e.key === '2') {
    e.preventDefault();
    setMarket('overseas', document.querySelector('.market-btn[data-market="overseas"]'));
  }
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-box')) searchResults.style.display = 'none';
});

function selectSymbol(code, name, market, exchange) {
  searchInput.value = '';
  searchResults.style.display = 'none';
  searchItems = [];
  loadChart(code, name, market, exchange);
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
  });
});

function highlightActiveWatch() {
  document.querySelectorAll('.watch-item').forEach(el => {
    el.classList.toggle('active', currentSymbol && el.dataset.code === currentSymbol.code);
  });
}

function updateWatchBtnLabel() {
  document.getElementById('add-watch-btn').textContent =
    currentSymbol && watchlistCache.some(w => w.code === currentSymbol.code) ? '★ 관심종목에서 제거' : '☆ 관심종목에 추가';
}

async function refreshGroups() {
  const res = await fetch('/api/groups');
  groupsCache = await res.json();
  const select = document.getElementById('watch-group-select');
  const prevValue = select.value;
  select.innerHTML = groupsCache.map(g => `<option value="${g.name}">${g.name}</option>`).join('');
  if (groupsCache.some(g => g.name === prevValue)) select.value = prevValue;
}

async function createGroup() {
  const name = prompt('새 그룹 이름을 입력하세요');
  if (!name || !name.trim()) return;
  await fetch('/api/groups', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name.trim() }),
  });
  await refreshGroups();
  refreshWatchlist();
}

async function removeGroup(name) {
  if (!confirm(`'${name}' 그룹을 삭제할까요? (안의 종목은 기본 그룹으로 이동됩니다)`)) return;
  await fetch(`/api/groups/${encodeURIComponent(name)}`, { method: 'DELETE' });
  await refreshGroups();
  refreshWatchlist();
}

async function refreshWatchlist() {
  const res = await fetch('/api/watchlist');
  watchlistCache = await res.json();
  const el = document.getElementById('watchlist');

  if (watchlistCache.length === 0 && groupsCache.length <= 1) {
    el.innerHTML = '<div class="muted">관심종목이 없습니다.<br>종목 검색 후 추가하세요.</div>';
  } else {
    const order = groupsCache.map(g => g.name);
    const byGroup = {};
    for (const item of watchlistCache) (byGroup[item.group_name] ??= []).push(item);
    el.innerHTML = order.map(groupName => {
      const items = byGroup[groupName] || [];
      const delBtn = groupName === '기본' ? '' : `<span class="del-group" onclick="removeGroup('${groupName}')">그룹삭제</span>`;
      const rows = items.map(i => `
        <div class="watch-item" data-code="${i.code}" onclick="loadChart('${i.code}', '${i.name}', '${i.market}', '${i.exchange || ''}')">
          <span class="name-col">${i.name}${i.market === 'overseas' ? '<span class="exchange-tag">해외</span>' : ''}</span>
          <span class="price-col" id="wprice-${i.code}">…</span>
          <span class="del" onclick="event.stopPropagation(); removeWatch('${i.code}')">✕</span>
        </div>`).join('') || '<div class="muted" style="padding:4px 12px;">비어있음</div>';
      return `<div class="group-block"><div class="group-title"><span>${groupName}</span>${delBtn}</div>${rows}</div>`;
    }).join('');
  }
  highlightActiveWatch();
  updateWatchBtnLabel();
  loadWatchPrices();
}

async function loadWatchPrices() {
  await Promise.allSettled(watchlistCache.map(async (i) => {
    const el = document.getElementById(`wprice-${i.code}`);
    if (!el) return;
    try {
      const res = await fetch(`/api/quote/${i.code}?market=${i.market || 'domestic'}`);
      if (!res.ok) { el.textContent = '-'; return; }
      const q = await res.json();
      const up = q.diff >= 0;
      el.textContent = `${Math.round(q.price).toLocaleString()} (${up ? '+' : ''}${q.pct}%)`;
      el.className = 'price-col ' + (up ? 'up' : 'down');
    } catch {
      el.textContent = '-';
    }
  }));
}

async function loadHoldingPrices() {
  await Promise.allSettled(holdingsCache.map(async (i) => {
    const el = document.getElementById(`hchg-${i.code}`);
    if (!el) return;
    const market = /^\d+$/.test(i.code) ? 'domestic' : 'overseas';
    try {
      const res = await fetch(`/api/quote/${i.code}?market=${market}`);
      if (!res.ok || !i.avg_price) { el.textContent = '-'; return; }
      const q = await res.json();
      const pct = (q.price - i.avg_price) / i.avg_price * 100;
      const up = pct >= 0;
      el.textContent = `${up ? '+' : ''}${pct.toFixed(2)}%`;
      el.className = up ? 'buy' : 'sell';
    } catch {
      el.textContent = '-';
    }
  }));
}

async function removeWatch(code) {
  await fetch(`/api/watchlist/${code}`, { method: 'DELETE' });
  refreshWatchlist();
}

async function addCurrentToWatchlist() {
  if (!currentSymbol) { alert('먼저 종목을 검색해서 선택하세요.'); return; }
  const already = watchlistCache.some(w => w.code === currentSymbol.code);
  if (already) { await removeWatch(currentSymbol.code); return; }
  const groupName = document.getElementById('watch-group-select').value || '기본';
  await fetch('/api/watchlist', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...currentSymbol, group_name: groupName }),
  });
  refreshWatchlist();
}

async function refreshHoldings() {
  const res = await fetch('/api/holdings');
  const items = await res.json();
  holdingsCache = items;
  document.getElementById('holdings-body').innerHTML = items.map(i => `
    <tr>
      <td>${i.code}</td><td>${i.name}</td><td>${i.shares}</td><td>${Math.round(i.avg_price).toLocaleString()}</td>
      <td id="hchg-${i.code}" class="muted">-</td><td>${i.note || ''}</td>
    </tr>
  `).join('') || '<tr><td colspan="6" class="muted">보유 중인 종목이 없습니다.</td></tr>';
  loadHoldingPrices();
}

async function refreshJournal() {
  const res = await fetch('/api/trades');
  const items = await res.json();
  document.getElementById('journal-body').innerHTML = items.map(i => {
    const pctCell = i.pct_change == null
      ? '<span class="muted">-</span>'
      : `<span class="${i.pct_change >= 0 ? 'buy' : 'sell'}">${i.pct_change >= 0 ? '+' : ''}${i.pct_change}%</span>`;
    const priceCell = `${Math.round(i.price).toLocaleString()}` +
      (i.buy_avg_price ? `<br><span class="muted" style="font-size:11px;">매수 ${Math.round(i.buy_avg_price).toLocaleString()}</span>` : '');
    return `
    <tr>
      <td>${i.traded_at.slice(0,16).replace('T',' ')}</td><td>${i.code}</td><td>${i.name}</td>
      <td class="${i.side}">${i.side === 'buy' ? '매수' : '매도'}</td>
      <td>${i.shares}</td><td>${pctCell}</td><td>${priceCell}</td><td>${i.note || ''}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="8" class="muted">매매 기록이 없습니다.</td></tr>';
  refreshPnlSummary();
}

async function refreshPnlSummary() {
  const res = await fetch('/api/trades/stats');
  const s = await res.json();
  const up = s.total_realized_pnl >= 0;
  const byStockRows = s.by_stock.slice(0, 5).map(b =>
    `<span style="margin-right:14px;">${b.name} <b class="${b.pnl >= 0 ? 'buy' : 'sell'}">${b.pnl >= 0 ? '+' : ''}${Math.round(b.pnl).toLocaleString()}</b></span>`
  ).join('') || '<span class="muted">매도 기록 없음</span>';
  document.getElementById('pnl-summary').innerHTML = `
    <div class="pnl-stat"><div class="label">누적 실현손익</div><div class="value ${up ? 'up' : 'down'}">${up ? '+' : ''}${Math.round(s.total_realized_pnl).toLocaleString()}원</div></div>
    <div class="pnl-stat"><div class="label">매도 승률</div><div class="value">${s.win_rate}% <span class="muted">(${s.sell_count}건)</span></div></div>
    <div class="pnl-stat" style="flex:1;"><div class="label">종목별 손익</div><div class="pnl-by-stock">${byStockRows}</div></div>
  `;
}

async function addTrade() {
  const body = {
    code: document.getElementById('j-code').value.trim(),
    name: document.getElementById('j-name').value.trim(),
    side: document.getElementById('j-side').value,
    shares: parseInt(document.getElementById('j-shares').value, 10),
    price: parseFloat(document.getElementById('j-price').value),
    note: document.getElementById('j-note').value.trim(),
  };
  if (!body.code || !body.name || !body.shares || !body.price) { alert('코드/이름/수량/가격을 입력하세요.'); return; }
  await fetch('/api/trades', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  ['j-code','j-name','j-shares','j-price','j-note'].forEach(id => document.getElementById(id).value = '');
  refreshJournal();
  refreshHoldings();
}

let orderSide = null;
function openOrderModal(side) {
  if (!currentSymbol) { alert('먼저 종목을 검색해서 선택하세요.'); return; }
  orderSide = side;
  document.getElementById('order-modal-title').textContent =
    `${currentSymbol.name} (${currentSymbol.code}) ${side === 'buy' ? '매수' : '매도'} 기록`;
  document.getElementById('o-shares').value = '';
  document.getElementById('o-price').value =
    currentChartData.length ? Math.round(currentChartData[currentChartData.length - 1].close) : '';
  document.getElementById('o-note').value = '';
  document.getElementById('o-real-order').checked = true;
  const isOverseas = currentSymbol.market === 'overseas';
  document.getElementById('o-exchange-row').style.display = isOverseas ? 'block' : 'none';
  document.getElementById('o-exchange').value = currentSymbol.exchange || 'NASD';
  document.getElementById('o-real-order-label').textContent =
    isOverseas ? 'KIS 계좌에도 실제 주문 전송 (해외, 미검증 - 신중히)' : 'KIS 계좌에도 실제 주문 전송';
  document.getElementById('order-modal').style.display = 'flex';
}

function closeOrderModal() {
  document.getElementById('order-modal').style.display = 'none';
}

async function submitOrder() {
  const shares = parseInt(document.getElementById('o-shares').value, 10);
  const price = parseFloat(document.getElementById('o-price').value);
  if (!shares || !price) { alert('수량/가격을 입력하세요.'); return; }
  const placeReal = document.getElementById('o-real-order').checked;
  const res = await fetch('/api/order', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      code: currentSymbol.code, name: currentSymbol.name, side: orderSide,
      shares, price, note: document.getElementById('o-note').value.trim(),
      place_real_order: placeReal,
      market: currentSymbol.market || 'domestic',
      exchange: document.getElementById('o-exchange').value,
    }),
  });
  const data = await res.json();
  closeOrderModal();
  refreshJournal();
  refreshHoldings();

  if (placeReal) {
    if (data.broker_error) {
      alert(`매매일지엔 기록됐지만, KIS 주문은 실패했어요:\n${data.broker_error}`);
    } else if (data.broker_result) {
      const msg = data.broker_result.msg1 || JSON.stringify(data.broker_result);
      alert(`KIS 주문 응답: ${msg}`);
    }
  }
}

let btChart, btSeries;
function ensureBacktestChart() {
  if (btChart) return;
  const el = document.getElementById('backtest-chart');
  btChart = LightweightCharts.createChart(el, {
    width: el.clientWidth,
    height: 280,
    layout: { background: { color: '#ffffff' }, textColor: '#333' },
    grid: { vertLines: { color: '#f0f1f3' }, horzLines: { color: '#f0f1f3' } },
    timeScale: { borderColor: '#e2e4e9' },
    rightPriceScale: { borderColor: '#e2e4e9' },
  });
  btSeries = btChart.addLineSeries({ color: '#3169d6', lineWidth: 2 });
  window.addEventListener('resize', () => btChart.applyOptions({ width: el.clientWidth }));
}

async function runBacktest() {
  const symbolsRaw = document.getElementById('bt-symbols').value.trim();
  if (!symbolsRaw) { alert('종목 코드를 1개 이상 입력하세요 (쉼표로 구분).'); return; }
  const body = {
    symbols: symbolsRaw.split(',').map(s => s.trim()).filter(Boolean),
    period: document.getElementById('bt-period').value.trim() || '3y',
    initial_capital: parseFloat(document.getElementById('bt-capital').value) || 10000000,
    fast_ma: parseInt(document.getElementById('bt-fast').value, 10) || 20,
    slow_ma: parseInt(document.getElementById('bt-slow').value, 10) || 60,
  };
  document.getElementById('bt-status').textContent = '실행 중... (종목이 많거나 기간이 길면 시간이 걸려요)';
  const res = await fetch('/api/backtest', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) {
    document.getElementById('bt-status').textContent = `실패: ${data.detail || '알 수 없는 오류'}`;
    return;
  }
  document.getElementById('bt-status').textContent = '';

  const metricsEl = document.getElementById('bt-metrics');
  metricsEl.style.display = 'flex';
  metricsEl.innerHTML = Object.entries(data.metrics).map(([k, v]) => `
    <div class="pnl-stat"><div class="label">${k}</div><div class="value">${typeof v === 'number' ? v.toLocaleString() : v}</div></div>
  `).join('');

  document.getElementById('backtest-chart').style.display = 'block';
  ensureBacktestChart();
  btSeries.setData(data.equity_curve.map(p => ({ time: p.date, value: p.equity })));
  btChart.timeScale().fitContent();

  document.getElementById('bt-trades-table').style.display = 'table';
  document.getElementById('bt-trades-body').innerHTML = data.trades.slice(-30).reverse().map(t => `
    <tr>
      <td>${t.symbol}</td><td>${t.entry_date}</td><td>${t.exit_date}</td>
      <td>${Math.round(t.entry_price).toLocaleString()}</td><td>${Math.round(t.exit_price).toLocaleString()}</td>
      <td>${t.shares}</td>
      <td class="${t.pnl >= 0 ? 'buy' : 'sell'}">${t.pnl >= 0 ? '+' : ''}${Math.round(t.pnl).toLocaleString()}</td>
      <td>${t.reason}</td>
    </tr>`).join('') || '<tr><td colspan="8" class="muted">거래 없음</td></tr>';
}

const SETTINGS_KEY = 'dashboardSettings';
let restoringSettings = false;

function saveSettings() {
  if (restoringSettings) return;
  localStorage.setItem(SETTINGS_KEY, JSON.stringify({
    market: currentMarket,
    interval: currentInterval,
    indicators: {
      ma5: document.getElementById('ma5-toggle').checked,
      ma20: document.getElementById('ma20-toggle').checked,
      ma60: document.getElementById('ma60-toggle').checked,
      ma120: document.getElementById('ma120-toggle').checked,
      bb: document.getElementById('bb-toggle').checked,
    },
    hoga: document.getElementById('hoga-toggle').checked,
    lastSymbol: currentSymbol,
  }));
}

async function restoreSettings() {
  let s;
  try { s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); } catch { s = null; }
  if (!s) return;
  restoringSettings = true;
  try {
    if (s.indicators) {
      for (const [key, val] of Object.entries(s.indicators)) {
        const el = document.getElementById(key + '-toggle');
        if (el) el.checked = val;
      }
    }
    if (s.market && s.market !== currentMarket) {
      const btn = document.querySelector(`.market-btn[data-market="${s.market}"]`);
      if (btn) setMarket(s.market, btn);
    }
    if (s.interval) {
      const btn = document.querySelector(`.tf-btn[data-interval="${s.interval}"]`);
      setInterval_(s.interval, btn || null);
    }
    if (s.lastSymbol) {
      await loadChart(s.lastSymbol.code, s.lastSymbol.name, s.lastSymbol.market, s.lastSymbol.exchange);
    }
    if (s.hoga && currentSymbol && currentSymbol.market !== 'overseas') {
      document.getElementById('hoga-toggle').checked = true;
      toggleHoga();
    }
  } finally {
    restoringSettings = false;
  }
  saveSettings();
}

initChart();
restoreSettings();
refreshGroups().then(refreshWatchlist);
refreshHoldings();
refreshJournal();
</script>
